<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <title>Lingua-Flow · Chronos Codex</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/immersion.css">
  <link rel="stylesheet" href="assets/css/theme-gate.css">
</head>
<body data-theme="codex">
  <div class="lf-reveal-veil" id="lf-reveal-veil" aria-hidden="true"></div>
  <div class="gate-behind-stage" aria-hidden="true"></div>

  <div class="gate-leaves-wrap" aria-hidden="true">
    <div class="gate-leaf gate-leaf-primary">
      <div class="gate-leaf-lattice"></div>
      <div class="gate-leaf-brace"></div>
      <div class="gate-locking-rod gate-rod-top"></div>
      <div class="gate-locking-rod gate-rod-bottom"></div>
      <img src="assets/textures/parts/part-corner-bracket.svg" alt="" class="gate-corner gate-corner-tl">
      <img src="assets/textures/parts/part-corner-bracket.svg" alt="" class="gate-corner gate-corner-bl">
    </div>
    <div class="gate-leaf gate-leaf-secondary">
      <div class="gate-leaf-lattice"></div>
      <div class="gate-leaf-brace"></div>
      <div class="gate-locking-rod gate-rod-top"></div>
      <div class="gate-locking-rod gate-rod-bottom"></div>
      <img src="assets/textures/parts/part-corner-bracket.svg" alt="" class="gate-corner gate-corner-tr">
      <img src="assets/textures/parts/part-corner-bracket.svg" alt="" class="gate-corner gate-corner-br">
    </div>
  </div>

  <div class="steam-pipe-unit steam-pipe-left" aria-hidden="true">
    <div class="steam-fluid-core"></div>
    <img src="assets/textures/parts/part-steam-pipe.svg" alt="" class="steam-pipe-img">
  </div>
  <div class="steam-pipe-unit steam-pipe-right" aria-hidden="true">
    <div class="steam-fluid-core"></div>
    <img src="assets/textures/parts/part-steam-pipe.svg" alt="" class="steam-pipe-img">
  </div>

  <div class="gate-foreground-shell">
    <header class="sigil-topbar">
      <div class="sigil-group">
        <a href="index.html" class="sigil-btn" aria-label="Return to Portal"><img src="assets/textures/ui-portal-return.svg" alt=""></a>
        <button type="button" class="sigil-lang-pill" id="sigil-lang-btn" aria-label="Switch Target Language">EN</button>
      </div>
      <div class="sigil-group">
        <button type="button" class="sigil-btn" id="sigil-sound-btn" aria-label="Toggle Audio"><img src="assets/textures/ui-audio-wave.svg" alt=""></button>
        <button type="button" class="sigil-btn" id="sigil-rule-btn" aria-label="Rules Guide"><img src="assets/textures/ui-rule-sigil.svg" alt=""></button>
      </div>
    </header>

    <main class="gate-mechanism-hub">
      <div class="gear-assembly">
        <div class="assembly-chassis-plate" aria-hidden="true"></div>
        <div class="gate-gauge-unit" aria-hidden="true">
          <img src="assets/textures/parts/part-gauge-dial.svg" alt="">
          <img src="assets/textures/parts/part-gauge-needle.svg" alt="" class="gate-gauge-needle">
        </div>
        <button type="button" class="gear-satellite gear-sat-a" aria-label="Next Case Gear"><img src="assets/textures/parts/part-gear-10-brass.svg" alt=""></button>
        <button type="button" class="gear-master-btn" id="gate-master-btn" aria-label="Open Codex Vault Gate">
          <img src="assets/textures/parts/part-gear-16-brass.svg" alt="" class="gear-master-rim">
          <img src="assets/textures/sigil-codex.svg" alt="" class="gear-master-core">
        </button>
        <button type="button" class="gear-satellite gear-sat-b" aria-label="Previous Case Gear"><img src="assets/textures/parts/part-gear-10-brass.svg" alt=""></button>
        <img src="assets/textures/parts/part-piston-rod.svg" alt="" class="piston-unit piston-unit-left" aria-hidden="true">
        <img src="assets/textures/parts/part-piston-rod.svg" alt="" class="piston-unit piston-unit-right" aria-hidden="true">
        <img src="assets/textures/parts/part-pawl-arm.svg" alt="" class="gate-pawl-unit" aria-hidden="true">
        <div class="gate-bolt-rail" aria-hidden="true"><img src="assets/textures/parts/part-lock-bolt.svg" alt="" class="gate-bolt-img"></div>
      </div>

      <div class="gate-control-console">
        <div class="gate-topic-screen" aria-live="polite">
          <span class="topic-screen-code tabular-num" id="topic-screen-code">#001</span>
          <span class="topic-screen-title" id="topic-screen-title">---</span>
        </div>
        <div class="drum-counter" role="group" aria-label="Three-Digit Curriculum Dial">
          <div class="drum-col">
            <button type="button" class="drum-step-btn" data-drum-delta="-100" aria-label="Hundreds Down">‹</button>
            <span class="drum-digit-window tabular-num" data-drum-digit="0">0</span>
            <button type="button" class="drum-step-btn" data-drum-delta="100" aria-label="Hundreds Up">›</button>
          </div>
          <div class="drum-col">
            <button type="button" class="drum-step-btn" data-drum-delta="-10" aria-label="Tens Down">‹</button>
            <span class="drum-digit-window tabular-num" data-drum-digit="1">0</span>
            <button type="button" class="drum-step-btn" data-drum-delta="10" aria-label="Tens Up">›</button>
          </div>
          <div class="drum-col">
            <button type="button" class="drum-step-btn" data-drum-delta="-1" aria-label="Ones Down">‹</button>
            <span class="drum-digit-window tabular-num" data-drum-digit="2">1</span>
            <button type="button" class="drum-step-btn" data-drum-delta="1" aria-label="Ones Up">›</button>
          </div>
        </div>
        <button type="button" class="gate-lever-track" id="gate-lever-btn" aria-label="Slide Lever to Open Gate">
          <span class="gate-lever-knob"><img src="assets/textures/ui-gate-handle.svg" alt=""></span>
          <span class="gate-lever-chevrons" aria-hidden="true">› › ›</span>
        </button>
      </div>
    </main>
    <footer style="height:8px;"></footer>
  </div>

  <div class="rule-overlay" id="rule-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="rule-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>时计法典 · 机械蒸汽闸门说明</h2>
        <button type="button" class="sigil-btn" id="rule-close-btn" aria-label="关闭"><img src="assets/textures/ui-close-sigil.svg" alt=""></button>
      </div>
      <p>欢迎步入<strong>时计法典（Chronos Codex）</strong>。本页面严格实行<strong>零母语沉浸</strong>：</p>
      <ul>
        <li>拨动<strong>三位数字滚轮</strong>或两侧从动齿轮，主从齿轮将按齿比咬合旋转，并驱动往复活塞与蒸汽液压管液位联动。</li>
        <li>点击中央主轮或拨动下方<strong>黄铜滑杆</strong>，将触发反转蓄力、棘爪弹起、门闩缩回与分段开闸，直入 Tufte 三栏案卷舞台。</li>
      </ul>
      <div class="rule-legend-row">
        <div class="rule-legend-item"><img src="assets/textures/ui-fsrs-1-again.svg" alt=""><span>重来 (Again)</span></div>
        <div class="rule-legend-item"><img src="assets/textures/ui-fsrs-2-hard.svg" alt=""><span>困难 (Hard)</span></div>
        <div class="rule-legend-item"><img src="assets/textures/ui-fsrs-3-good.svg" alt=""><span>良好 (Good)</span></div>
        <div class="rule-legend-item"><img src="assets/textures/ui-fsrs-4-easy.svg" alt=""><span>轻松 (Easy)</span></div>
      </div>
    </div>
  </div>

  <script src="assets/js/lingua-core.js"></script>
  <script src="assets/js/immersion-shell.js"></script>
  <script src="assets/js/theme-home.js"></script>
</body>
</html>
