<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="64" height="64">
  <defs>
    <!-- 1. 材质物理与光学滤镜层：6阶 Gooch 冷暖渐变 + 羊皮纸 SSS + 蔡司透镜焦散 -->
    <radialGradient id="ded-bg-grad" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#0b1325"/>
      <stop offset="90%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#1c140d"/>
    </radialGradient>
    <linearGradient id="ded-brass-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="22%" stop-color="#fde047"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="72%" stop-color="#b45309"/>
      <stop offset="88%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="ded-scroll-sss" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="ded-lens-caustic" cx="36%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="25%" stop-color="#bae6fd" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="82%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.58"/>
    </radialGradient>
    <linearGradient id="ded-laser-beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="25%" stop-color="#f87171"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="ded-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 2. <g id="layer-footprint">：流派专属底座（皇家钟楼擒纵齿轮盘与煤气灯丁达尔光束，零虚线环） -->
  <g id="layer-footprint">
    <circle cx="128" cy="128" r="120" fill="url(#ded-bg-grad)" stroke="url(#ded-brass-grad)" stroke-width="6"/>
    <circle cx="128" cy="128" r="110" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.55"/>
    <!-- 12向钟表罗马刻度齿 -->
    <path d="M128,12 L128,24 M128,232 L128,244 M12,128 L24,128 M232,128 L244,128 M46,46 L55,55 M201,201 L210,210 M210,46 L201,55 M55,201 L46,210" stroke="url(#ded-brass-grad)" stroke-width="4" stroke-linecap="round"/>
    <!-- 丁达尔暖金体积光束 -->
    <polygon points="78,14 178,14 218,242 38,242" fill="#f59e0b" fill-opacity="0.16"/>
    <polygon points="102,14 154,14 186,242 70,242" fill="#fef08a" fill-opacity="0.12"/>
  </g>

  <!-- 3. <g id="layer-chassis">：主体体积剪影（哥特法庭双柱、次表面透光羊皮纸卷轴与单核轴向钟摆） -->
  <g id="layer-chassis">
    <!-- 两侧哥特法庭高耸石柱剪影 -->
    <polygon points="26,212 52,36 72,36 54,218" fill="#070c18" stroke="#1e293b" stroke-width="1.5"/>
    <polygon points="230,212 204,36 184,36 202,218" fill="#070c18" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M52,42 Q128,78 204,42" fill="none" stroke="#1e293b" stroke-width="5"/>
    <!-- 悬浮次表面透光 (SSS) 伪证羊皮纸卷轴 -->
    <path d="M64,52 Q128,42 192,52 L184,96 Q128,88 72,96 Z" fill="url(#ded-scroll-sss)" stroke="#fde68a" stroke-width="2"/>
    <rect x="56" y="48" width="8" height="50" rx="3" fill="url(#ded-brass-grad)"/>
    <rect x="192" y="48" width="8" height="50" rx="3" fill="url(#ded-brass-grad)"/>
    <!-- 卷轴手写证词纹理与矛盾红框 -->
    <line x1="80" y1="64" x2="176" y2="64" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <rect x="96" y="72" width="64" height="14" rx="3" fill="#dc2626" fill-opacity="0.28" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="104" y1="79" x2="152" y2="79" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 单核轴向黄铜钟摆主杆 -->
    <rect x="123" y="14" width="10" height="132" fill="url(#ded-brass-grad)" stroke="#451a03" stroke-width="1"/>
  </g>

  <!-- 4. <g id="layer-mechanics">：中观真实工程次级部件（擒纵齿轮、蔡司光学显微透镜、防爆铆钉与矛盾激光针） -->
  <g id="layer-mechanics">
    <!-- 钟摆擒纵内齿轮 -->
    <circle cx="128" cy="158" r="52" fill="#0b1325" stroke="url(#ded-brass-grad)" stroke-width="8"/>
    <circle cx="128" cy="158" r="40" fill="url(#ded-lens-caustic)" stroke="#fef08a" stroke-width="2"/>
    <!-- 8颗黄铜法兰铆钉 -->
    <circle cx="128" cy="106" r="3.5" fill="#fef9c3"/>
    <circle cx="128" cy="210" r="3.5" fill="#fef9c3"/>
    <circle cx="76" cy="158" r="3.5" fill="#fef9c3"/>
    <circle cx="180" cy="158" r="3.5" fill="#fef9c3"/>
    <circle cx="91" cy="121" r="3.5" fill="#fbbf24"/>
    <circle cx="165" cy="121" r="3.5" fill="#fbbf24"/>
    <circle cx="91" cy="195" r="3.5" fill="#fbbf24"/>
    <circle cx="165" cy="195" r="3.5" fill="#fbbf24"/>
    <!-- 透镜手柄与卡尺刻度 -->
    <rect x="120" y="210" width="16" height="34" rx="4" fill="url(#ded-brass-grad)" stroke="#451a03" stroke-width="1.5"/>
    <!-- 向上穿刺的猩红矛盾指控激光针 -->
    <line x1="128" y1="236" x2="128" y2="79" stroke="url(#ded-laser-beam)" stroke-width="6" filter="url(#ded-glow)"/>
    <line x1="128" y1="236" x2="128" y2="79" stroke="#ffffff" stroke-width="2"/>
    <circle cx="128" cy="79" r="9" fill="#fef08a" stroke="#dc2626" stroke-width="3" filter="url(#ded-glow)"/>
  </g>

  <!-- 5. <g id="layer-patina-fx">：时间磨损包浆、亚毫米倒角高光、蔡司折射光斑与奶油散景微粒 -->
  <g id="layer-patina-fx">
    <!-- 蔡司透镜月牙形高光反射斑 -->
    <path d="M102,136 Q124,118 152,134" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.82"/>
    <ellipse cx="144" cy="174" rx="10" ry="5" transform="rotate(-25 144 174)" fill="#fde68a" fill-opacity="0.65"/>
    <!-- 0.5px 亚毫米金属磨损划痕与散景微粒 -->
    <path d="M84,148 L94,142 M162,172 L172,166" stroke="#fef9c3" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="64" cy="132" r="4" fill="#fef08a" fill-opacity="0.65"/>
    <circle cx="194" cy="124" r="5" fill="#fbbf24" fill-opacity="0.55"/>
    <circle cx="82" cy="198" r="3.5" fill="#38bdf8" fill-opacity="0.6"/>
    <circle cx="176" cy="196" r="4.5" fill="#fef08a" fill-opacity="0.6"/>
  </g>
</svg>
