<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%" role="img" aria-label="刻痕圣殿·玫瑰花窗与六翼榫卯法阵 HUD 贴图">
  <defs>
    <!-- 3C+3C+3A: 新粗野主义硬边阴影 + 彩绘玻璃花窗黑铅条 + 背光宝石彩色焦散 -->
    <linearGradient id="str-hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020605" />
      <stop offset="55%" stop-color="#091e1a" />
      <stop offset="100%" stop-color="#020605" />
    </linearGradient>
    <linearGradient id="str-hud-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="str-hud-sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="str-hud-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="str-hud-ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <style>
      .str-rose-outer {
        transform-origin: 0px 0px;
        animation: str-rose-spin 24s linear infinite;
      }
      .str-rose-ruby {
        transform-origin: 0px 0px;
        animation: str-ruby-pulse 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate;
      }
      @keyframes str-rose-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes str-ruby-pulse {
        0% { transform: scale(0.92); }
        100% { transform: scale(1.14); }
      }
      @media (prefers-reduced-motion: reduce) {
        .str-rose-outer, .str-rose-ruby {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Layer 1: Footprint & Grounding (新粗野主义 45° 硬边黑影与黑曜石底座层) -->
  <g id="layer-footprint">
    <rect x="6" y="6" width="590" height="120" rx="6" fill="#000000" />
    <rect x="2" y="2" width="590" height="120" rx="6" fill="url(#str-hud-bg)" stroke="#34d399" stroke-width="2.5" />
    <!-- 圣殿几何构成网格 -->
    <line x1="2" y1="62" x2="592" y2="62" stroke="#064e3b" stroke-width="1.5" />
    <line x1="200" y1="2" x2="200" y2="122" stroke="#064e3b" stroke-width="1.5" />
    <line x1="400" y1="2" x2="400" y2="122" stroke="#064e3b" stroke-width="1.5" />
  </g>

  <!-- Layer 2: Primary Chassis (三舱彩绘玻璃铅条镶边与硬阴影装甲层) -->
  <g id="layer-chassis">
    <!-- 左舱 S (主格翡翠花窗槽) + 硬阴影 -->
    <polygon points="22,22 184,22 192,66 184,110 22,110" fill="#000000" />
    <polygon points="18,18 180,18 188,62 180,106 18,106" fill="#041310" stroke="#020605" stroke-width="3" />
    <polygon points="18,18 180,18 188,62 180,106 18,106" fill="none" stroke="#34d399" stroke-width="1.8" />

    <!-- 中舱 V (谓核玫瑰花窗核心) + 硬阴影 -->
    <polygon points="224,16 384,16 396,66 384,114 224,114 212,66" fill="#000000" />
    <polygon points="220,12 380,12 392,62 380,110 220,110 208,62" fill="#041310" stroke="#fbbf24" stroke-width="2.2" />

    <!-- 右舱 O (宾格天青/绯红花窗槽) + 硬阴影 -->
    <polygon points="420,22 580,22 580,110 420,110 412,66" fill="#000000" />
    <polygon points="416,18 576,18 576,106 416,106 408,62" fill="#041310" stroke="#38bdf8" stroke-width="1.8" />
  </g>

  <!-- Layer 3: Internal Mechanics (六翼放射折纸法阵与 S-V-O 榫卯公差卡口层) -->
  <g id="layer-mechanics">
    <!-- 左舱：主格翡翠花窗晶格 -->
    <polygon points="28,28 72,28 84,62 72,96 28,96" fill="url(#str-hud-emerald)" stroke="#020605" stroke-width="2.5" />
    <line x1="28" y1="62" x2="84" y2="62" stroke="#020605" stroke-width="2.5" />
    <text x="94" y="48" fill="#a7f3d0" font-family="monospace" font-weight="bold" font-size="10">SLOT I · AGENT</text>
    <text x="94" y="66" fill="#34d399" font-family="sans-serif" font-size="9">主格鲁班锁阳榫</text>
    <rect x="94" y="76" width="74" height="10" fill="url(#str-hud-emerald)" stroke="#020605" stroke-width="1.5" />

    <!-- 中舱：中心六翼玫瑰花窗法阵 -->
    <g transform="translate(300, 62)">
      <g class="str-rose-outer">
        <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="url(#str-hud-amber)" stroke="#020605" stroke-width="3" />
        <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="url(#str-hud-emerald)" stroke="#020605" stroke-width="2.5" />
        <line x1="-36" y1="-21" x2="36" y2="21" stroke="#020605" stroke-width="2.5" />
        <line x1="-36" y1="21" x2="36" y2="-21" stroke="#020605" stroke-width="2.5" />
        <line x1="0" y1="-42" x2="0" y2="42" stroke="#020605" stroke-width="2.5" />
      </g>
      <circle class="str-rose-ruby" cx="0" cy="0" r="10" fill="url(#str-hud-ruby)" stroke="#fef08a" stroke-width="2" />
    </g>

    <!-- 右舱：宾格与词缀彩绘花窗晶格 -->
    <polygon points="520,28 566,28 566,96 520,96 508,62" fill="url(#str-hud-sapphire)" stroke="#020605" stroke-width="2.5" />
    <line x1="508" y1="62" x2="566" y2="62" stroke="#020605" stroke-width="2.5" />
    <text x="422" y="48" fill="#bae6fd" font-family="monospace" font-weight="bold" font-size="10">SLOT III · OBJECT</text>
    <text x="422" y="66" fill="#38bdf8" font-family="sans-serif" font-size="9">宾格燕尾槽阴卯</text>
    <rect x="422" y="76" width="74" height="10" fill="url(#str-hud-sapphire)" stroke="#020605" stroke-width="1.5" />
  </g>

  <!-- Layer 4: Patina & FX (彩色焦散投影与榫卯咬合锁扣层) -->
  <g id="layer-patina-fx">
    <!-- 左右榫卯咬合卡口 (Mortise & Tenon Interlocks) -->
    <rect x="182" y="52" width="32" height="20" fill="url(#str-hud-amber)" stroke="#020605" stroke-width="2.5" />
    <rect x="386" y="52" width="32" height="20" fill="url(#str-hud-amber)" stroke="#020605" stroke-width="2.5" />
    <!-- 宝石高光切面反光 -->
    <polygon points="32,32 52,32 42,46" fill="#ffffff" opacity="0.45" />
    <polygon points="292,26 308,26 300,38" fill="#ffffff" opacity="0.55" />
    <polygon points="526,32 546,32 536,46" fill="#ffffff" opacity="0.45" />
  </g>
</svg>

